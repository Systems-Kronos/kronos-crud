<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Administrador</title>
  <style>
    body { font-family: Arial; background-color: #f5f6fa; padding: 40px; }
    form {
      width: 400px; margin: auto; background: white; padding: 20px;
      border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 4px; }
    button { margin-top: 20px; width: 100%; padding: 10px; background: #40739e; color: white; border: none; border-radius: 4px; }
  </style>
</head>
<body>

<h1 style="text-align:center;">Cadastrar Administrador</h1>
<form action="/KronosCRUD_war/AdministracaoController" method="post">
  <input type="hidden" name="acao" value="inserir">

  <label>ID:</label>
  <input type="number" name="id" required>

  <label>Nome:</label>
  <input type="text" name="nome" required>

  <label>Email:</label>
  <input type="email" name="email" required>

  <label>Senha:</label>
  <input type="password" name="senha" required>

  <label>Código de Acesso:</label>
  <input type="text" name="codigoAcesso" required>

  <button type="submit">Cadastrar</button>
</form>

</body>
</html>
