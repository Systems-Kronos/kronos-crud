<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-------------------- Fontes -------------------->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;500;700;900&family=Crete+Round:wght@400;700&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/crud/style/dados.css">
    <title>CRUD - Kronos</title>
</head>
<body>
    <div class="meuPlaceholder"></div>
    <header>
        <h1>KRONOS</h1>    
        <nav>
            <ul>
                <li><a href="#" class="ativo"><img src="../assets/crud/img/img-crud-administrador.png" alt=""> Administrador</a></li>
                <li><a href="#"><img src="../assets/crud/img/img-crud-empresas.png" alt=""> Empresas</a></li>
                <li><a href="#"><img src="../assets/crud/img/img-crud-planos.png" alt=""> Planos</a></li>
                <li><a href="#"><img src="../assets/crud/img/img-crud-habilidades.png" alt=""> Habilidades</a></li>
                <li><a href="#"><img src="../assets/crud/img/img-crud-setores.png" alt=""> Setores</a></li>
                <li><a href="#"><img src="../assets/crud/img/img-crud-usuario.png" alt=""> Usuário</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <input type="search" placeholder="Pesquisar" class="buscar">
        <div class="caixaFiltro">
            <input type="checkbox" id="filtro" class="filtros">
            <label for="filtro" class="filtro">Filtros</label>
            
            <form class="opcoesFiltro">
                <div class="cadaFiltro">
                    <label for="filtroAaZz" class="etiquetaFiltro">
                        <input type="checkbox" name="filtragemAlfabeto" id="filtroAaZz">Aa-Zz
                    </label>
                </div> 
                <div class="cadaFiltro">
                    <label for="filtroZzAa" class="etiquetaFiltro">
                        <input type="checkbox" name="filtragemAlfabeto" id="filtroZzAa">Zz-Aa
                    </label>
                </div>
                <div class="cadaFiltro">
                    <label for="filtroCrescente" class="etiquetaFiltro">
                        <input type="checkbox" name="filtragemOrdem" id="filtroCrescente">Crescente
                    </label>
                    
                </div>
                <div class="cadaFiltro">
                    <label for="filtroDecrescente" class="etiquetaFiltro">
                        <input type="checkbox" name="filtragemOrdem" id="filtroDecrescente">Decrescente
                    </label>
                </div>
        
                <button type="reset" class="limparFiltro">Limpar filtros</button>
            </form>
        </div>
    </main>
</body>
</html>
