<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-------------------- Fontes -------------------->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;500;700;900&family=Crete+Round:wght@400;700&display=swap"
        rel="stylesheet">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/landingpage/img/favikronos.ico" type="image/x-icon">
    <link rel="stylesheet" href="../assets/crud/style/dados.css">
    <title>CRUD - Kronos</title>
</head>

<body>
    <div class="meuPlaceholder"></div>
    <header>
        <h1>KRONOS</h1>
        <nav>
            <ul>
                <li><a href="administrador.html"><img src="../assets/crud/img/img-crud-administrador.png" alt="">Administrador</a></li>
                <li><a href="empresas.html"><img src="../assets/crud/img/img-crud-empresas.png" alt=""> Empresas</a></li>
                <li><a href="planos.html"><img src="../assets/crud/img/img-crud-planos.png" alt=""> Planos</a></li>
                <li><a href="habilidades.html"><img src="../assets/crud/img/img-crud-habilidades.png" alt=""> Habilidades</a></li>
                <li><a href="setores.html"><img src="../assets/crud/img/img-crud-setores.png" alt=""> Setores</a></li>
                <li><a href="usuario.html" class="ativo"><img src="../assets/crud/img/img-crud-usuario.png" alt=""> Usuário</a></li>
            </ul>
        </nav>
    </header>

    <div class="conteudoPrincipal">
        <div class="procurarCadastrar">
            <form class="pesquisa">
                <input type="search" placeholder="Pesquisar" class="buscar">

                <details class="filtros">
                    <summary>Filtros</summary>
                    <div class="conteudoFiltros">
                        <label class="opcaoFiltro">
                            <input type="radio" name="ordem" value="crescente">Crescente
                        </label>
                        <label class="opcaoFiltro">
                            <input type="radio" name="ordem" value="decrescente">Decrescente
                        </label>
                        <button type="reset">Limpar filtros</button>
                    </div>
                </details>
            </form>

            <!-- CREATE -->

            <section class="create">
                <dialog id="create">
                    <h2>Cadastrar usuário</h2>
                    <form action="" method="post">
                        <div class="campos">
                            <div>
                                <div class="campo">
                                    <label for="nomeCreate">Nome</label>
                                    <input type="text" name="nome" id="nomeCreate" autocomplete="off" required>
                                </div>
                                <div class="campo">
                                    <label for="cpfCreate">CPF</label>
                                    <input type="text" name="cpf" id="cpfCreate" autocomplete="off" required>
                                </div>
                                <div class="campo">
                                    <label for="senhaCreate">Senha</label>
                                    <input type="password" name="senha" id="senhaCreate" autocomplete="new-password" required>
                                </div>
                                <div class="campoLado">
                                    <div class="campo">
                                        <label for="generoCreate">Gênero</label>
                                        <select name="genero" id="generoCreate">
                                            <option value="M">M</option>
                                            <option value="F">F</option>
                                            <option value="O">O</option>
                                        </select>
                                    </div>
                                    <div class="campo">
                                        <label for="statusCreate">Status</label>
                                        <select name="status" id="statusCreate">
                                            <option value="Ativo" selected>Ativo</option>
                                            <option value="Inativo">Inativo</option>
                                            <option value="Férias">Férias</option>
                                            <option value="Desligado">Desligado</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <div class="campo">
                                    <label for="idSetorCreate">ID do Setor</label>
                                    <input type="number" name="idSetor" id="idSetorCreate" min="1" required>
                                </div>
                                <div class="campo">
                                    <label for="idSupervisorCreate">ID do Supervisor</label>
                                    <input type="number" name="idSupervisor" id="idSupervisorCreate" min="1" required>
                                </div>
                            </div>
                        </div>
                        <menu>
                            <button type="submit">Cadastrar</button>
                            <button type="button" onclick="document.getElementById('create').close()">Cancelar</button>
                        </menu>
                    </form>
                </dialog>
                
                <button type="button" onclick="document.getElementById('create').showModal()" class="cadastrar">Cadastrar</button>
            </section>
            

            <!-- UPDATE -->

            <section class="update">
                <dialog id="update">
                    <h2>Editar usuário</h2>
                    <form action="" method="post">
                        <div class="campos">
                            <div>
                                <div class="campo">
                                    <label for="nomeUpdate">Nome</label>
                                    <input type="text" name="nome" id="nomeUpdate" autocomplete="off" required>
                                </div>
                                <div class="campo">
                                    <label for="cpfUpdate">CPF</label>
                                    <input type="text" name="cpf" id="cpfUpdate" autocomplete="off" required>
                                </div>
                                <div class="campo">
                                    <label for="senhaUpdate">Senha</label>
                                    <input type="password" name="senha" id="senhaUpdate" autocomplete="new-password" required>
                                </div>
                                <div class="campoLado">
                                    <div class="campo">
                                        <label for="generoUpdate">Gênero</label>
                                        <select name="genero" id="generoUpdate">
                                            <option value="M">M</option>
                                            <option value="F">F</option>
                                            <option value="O">O</option>
                                        </select>
                                    </div>
                                    <div class="campo">
                                        <label for="statusUpdate">Status</label>
                                        <select name="status" id="statusUpdate">
                                            <option value="Ativo" selected>Ativo</option>
                                            <option value="Inativo">Inativo</option>
                                            <option value="Férias">Férias</option>
                                            <option value="Desligado">Desligado</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <div class="campo">
                                    <label for="idSetorUpdate">ID do Setor</label>
                                    <input type="number" name="idSetor" id="idSetorUpdate" min="1" required>
                                </div>
                                <div class="campo">
                                    <label for="idSupervisorUpdate">ID do Supervisor</label>
                                    <input type="number" name="idSupervisor" id="idSupervisorUpdate" min="1" required>
                                </div>
                            </div>
                        </div>
                        <menu>
                            <button type="submit">Confirmar alterações</button>
                            <button type="button" onclick="document.getElementById('update').close()">Cancelar</button>
                        </menu>
                    </form>
                </dialog>                
            </section>

            <!-- DELETE -->

            <section class="delete">
                <dialog id="delete">
                    <h2>Excluir setor</h2>
                    <form action="" method="post">
                        <div class="campos">
                            <div>
                                <div class="campo">
                                    <label for="nomeDelete">Nome</label>
                                    <input type="text" name="nome" id="nomeDelete" autocomplete="off" required>
                                </div>
                                <div class="campo">
                                    <label for="cpfDelete">CPF</label>
                                    <input type="text" name="cpf" id="cpfDelete" autocomplete="off" required>
                                </div>
                                <div class="campo">
                                    <label for="senhaDelete">Senha</label>
                                    <input type="password" name="senha" id="senhaDelete" autocomplete="new-password" required>
                                </div>
                                <div class="campoLado">
                                    <div class="campo">
                                        <label for="generoDelete">Gênero</label>
                                        <select name="genero" id="generoDelete">
                                            <option value="M">M</option>
                                            <option value="F">F</option>
                                            <option value="O">O</option>
                                        </select>
                                    </div>
                                    <div class="campo">
                                        <label for="statusDelete">Status</label>
                                        <select name="status" id="statusDelete">
                                            <option value="Ativo" selected>Ativo</option>
                                            <option value="Inativo">Inativo</option>
                                            <option value="Férias">Férias</option>
                                            <option value="Desligado">Desligado</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <div class="campo">
                                    <label for="idSetorDelete">ID do Setor</label>
                                    <input type="number" name="idSetor" id="idSetorDelete" min="1" required>
                                </div>
                                <div class="campo">
                                    <label for="idSupervisorDelete">ID do Supervisor</label>
                                    <input type="number" name="idSupervisor" id="idSupervisorDelete" min="1" required>
                                </div>
                            </div>
                        </div>
                        <menu>
                            <button type="submit" value="true">Confirmar exclusão</button>
                            <button type="button" id="botaoFecharModal" onclick="document.getElementById('delete').close()" value="false">Cancelar</button>
                        </menu>
                    </form>
                </dialog>                
            </section>
        </div>

        <!-- READ -->

        <main>
            <div class="tabelaScroll">
                <table class="tabelaHabilidades">
                    <thead>
                        <tr>
                            <th>Ver</th>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Senha</th>
                            <th>Gênero</th>
                            <th>Status</th>
                            <th>Setor</th>
                            <th>Supervisor</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <form action="usuario.html" method="post"><input type="hidden" name="acao" value="update"><input type="hidden" name="pk" value="1"><button type="submit" class="detalhes"><img src="../assets/crud/img/mais-detalhes.png" alt=""></button></form>
                            </td>
                            <td>1</td>
                            <td>Kevin</td>
                            <td>111.111.111-90</td>
                            <td>********</td>
                            <td>M</td>
                            <td>Ativo</td>
                            <td>Desenvolvimento CRUD</td>
                            <td>João Pradinho</td>
                            <td>
                                <form action="index.jsp" method="post"><input type="hidden" name="acao" value="update"><input type="hidden" name="pk" value="1"><button type="submit" class="detalhes"><img src="../assets/crud/img/deletar-kronos.png" alt=""></button></form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
