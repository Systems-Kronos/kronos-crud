<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-------------------- Fontes -------------------->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;500;700;900&family=Crete+Round:wght@400;700&display=swap"
        rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../assets/crud/script/script.js" defer></script>
    <link rel="icon" href="../assets/landingpage/img/favikronos.ico" type="image/x-icon">
    <link rel="stylesheet" href="../assets/crud/style/dados.css">
    <title>CRUD - Kronos</title>
</head>

<body>
    <div class="meuPlaceholder"></div>
    <header>
        <h1>KRONOS</h1>
        <nav>
            <ul>
                <li><a href="administrador.html" class="ativo"><img src="../assets/crud/img/img-crud-administrador.png" alt="">Administrador</a></li>
                <li><a href="empresas.html"><img src="../assets/crud/img/img-crud-empresas.png" alt=""> Empresas</a></li>
                <li><a href="planos.html"><img src="../assets/crud/img/img-crud-planos.png" alt=""> Planos</a></li>
                <li><a href="habilidades.html"><img src="../assets/crud/img/img-crud-habilidades.png" alt=""> Habilidades</a></li>
                <li><a href="setores.html"><img src="../assets/crud/img/img-crud-setores.png" alt=""> Setores</a></li>
                <li><a href="habilidades.html"><img src="../assets/crud/img/img-crud-usuario.png" alt=""> Usuário</a></li>
            </ul>
        </nav>
    </header>

    <div class="conteudoPrincipal">
        <div class="procurarCadastrar">
            <form class="pesquisa">
                <input type="search" placeholder="Pesquisar" class="buscar">

                <details class="filtros">
                    <summary>Filtros</summary>
                    <div class="conteudoFiltros">
                        <label class="opcaoFiltro">
                            <input type="radio" name="ordem" value="crescente">Crescente
                        </label>
                        <label class="opcaoFiltro">
                            <input type="radio" name="ordem" value="decrescente">Decrescente
                        </label>
                        <button type="reset">Limpar filtros</button>
                    </div>
                </details>
            </form>

            <!-- CREATE -->

            <section class="create">
                <dialog id="create">
                    <h2>Cadastrar administrador</h2>
                    <form action="" method="get">
                        <div class="campos">
                            <div>
                                <div class="campo">
                                    <label for="nomeCreate">Nome</label>
                                    <input type="text" name="nome" id="nomeCreate" autocomplete="off" required>
                                </div>
                                <div class="campo">
                                    <label for="senhaCreate">Senha</label>
                                    <input type="password" name="senha" id="senhaCreate" autocomplete="new-password" required>
                                </div>
                            </div>
                            <div>
                                <div class="campo">
                                    <label for="emailCreate">E-mail</label>
                                    <input type="email" name="email" id="emailCreate" required>
                                </div>
                            </div>
                        </div>
                        <menu>
                            <button type="submit">Cadastrar</button>
                            <button type="button" class="acaoModal" data-acao="fechar" data-modal="create">Cancelar</button>
                        </menu>
                    </form>
                </dialog>
                
                <button type="button" class="cadastrar acaoModal" data-acao="abrir" data-modal="create">Cadastrar</button>
            </section>
            

            <!-- UPDATE -->

            <section class="update">
                <dialog id="update">
                    <h2>Editar administrador</h2>
                    <form action="" method="get">
                        <div class="campos">
                            <div>
                                <div class="campo">
                                    <label for="nomeUpdate">Nome</label>
                                    <input type="text" name="nome" id="nomeUpdate" required>
                                </div>
                                <div class="campo">
                                    <label for="senhaUpdate">Senha</label>
                                    <input type="password" name="senha" id="senhaUpdate" required>
                                </div>
                            </div>
                            <div>
                                <div class="campo">
                                    <label for="emailUpdate">E-mail</label>
                                    <input type="email" name="email" id="emailUpdate" required>
                                </div>
                            </div>
                        </div>
                        <menu>
                            <button type="submit">Confirmar alterações</button>
                            <button type="button" class="acaoModal" data-acao="fechar" data-modal="update">Cancelar</button>
                        </menu>
                    </form>
                </dialog>                
            </section>

            <!-- DELETE -->

            <section class="delete">
                <dialog id="delete">
                    <h2>Excluir administrador</h2>
                    <form action="" method="get">
                        <div class="campos">
                            <div>
                                <div class="campo">
                                    <label for="nomeDelete">Nome</label>
                                    <input type="text" name="nome" id="nomeDelete" disabled value="Davi Aliaga">
                                </div>
                                <div class="campo">
                                    <label for="senhaDelete">Senha</label>
                                    <input type="password" name="senha" id="senhaDelete" disabled value="12345678">
                                </div>
                            </div>
                            <div>
                                <div class="campo">
                                    <label for="emailDelete">E-mail</label>
                                    <input type="email" name="email" id="emailDelete" disabled value="email@dominio.com">
                                </div>
                            </div>
                        </div>
                        <menu>
                            <button type="submit" value="true">Confirmar exclusão</button>
                            <button type="button" class="acaoModal" data-acao="fechar" data-modal="delete" value="false">Cancelar</button>
                        </menu>
                    </form>
                </dialog>                
            </section>
        </div>
        
            <!-- READ -->
        
        <main>
            <div class="tabelaScroll">
                <table class="tabelaAdministrador">
                    <thead>
                        <tr>
                            <th>Ver</th>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Senha</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <form method="get"><input type="hidden" name="acao" value="update"><input type="hidden" name="pk" value="3"><button type="submit" class="detalhes"><img src="../assets/crud/img/mais-detalhes.png" alt=""></button></form>
                            </td>
                            <td>1</td>
                            <td>João Victor Conceição do Prado</td>
                            <td>Lanna_Carmo_1234@gmail.com</td>
                            <td>*********</td>
                            <td>
                                <form method="get"><input type="hidden" name="acao" value="delete"><input type="hidden" name="pk" value="3"><button type="submit" class="detalhes"><img src="../assets/crud/img/deletar-kronos.png" alt=""></button></form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
